[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nativeready"
version = "0.4.1"
description = "Python SDK for the NativeReady API: predict native mass spectrometry suitability from a protein sequence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Brhanu F. Znabu", email = "25674436@nebraska.edu" },
]
keywords = ["mass-spectrometry", "native-ms", "protein", "esm-2", "bioinformatics", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
progress = ["tqdm>=4.0"]
all = ["pandas>=1.3", "tqdm>=4.0"]

[project.urls]
Homepage = "https://nativeready.bio"
Repository = "https://github.com/brhanufen/nativeready"
Issues = "https://github.com/brhanufen/nativeready/issues"

[project.scripts]
nativeready = "nativeready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nativeready"]
